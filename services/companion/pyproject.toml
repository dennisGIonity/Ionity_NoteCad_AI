# Ionity NoteCad - Companion | Ionity Global (Pty) Ltd | AEDI | Policy 986 AED | License AED 900
[project]
name = "notecad-companion"
version = "0.1.0"
description = "NoteCad Companion: a private on-device model that learns its owner (Ionity Global (Pty) Ltd)"
authors = [{ name = "Dennis Grobler (Wabakipi)", email = "dennis.g@ionity.digital" }]
license = { text = "AED 900 - Policy 986 AED - (c) 2026 Ionity Global (Pty) Ltd" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3.36"]          # Gemma 4 E2B/E4B + EmbeddingGemma in-process
train = ["torch", "transformers>=4.57", "peft>=0.17", "trl>=0.24", "datasets"]  # desktop / Edge node only
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2.16"]  # httpx2: what Starlette's test client wants now

[tool.setuptools]
packages = ["notecad_companion"]

[tool.pytest.ini_options]
markers = ["live: needs the real GGUF models (set NC_COMPANION_MODEL_PATH / NC_COMPANION_EMBED_MODEL_PATH)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# bugs, not style: pyflakes, syntax errors, bugbear, pylint errors. B008: FastAPI Depends() defaults.
select = ["F", "E9", "B", "PLE"]
ignore = ["B008", "B904", "B905"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# db.one() is Optional; on aggregates (count, max) and rows just written it cannot be None. Reported, not failed.
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
pythonVersion = "3.11"
include = ["notecad_companion"]
