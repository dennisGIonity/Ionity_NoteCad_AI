[package]
name = "notecad-desktop"
version = "0.3.0"
description = "Ionity Business Mind Map (IBMM): transparent voice recorder and live mind map"
authors = ["Dennis Grobler <dennis.g@ionity.digital>"]
edition = "2021"
publish = false

[lib]
name = "notecad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
