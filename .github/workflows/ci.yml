# What the desktop PC cannot do itself (Smart App Control, nothing on C:): Postgres, the Android APK and the Tauri
# window are built and tested here, on clean GitHub machines. Models are never needed: the tests are hermetic.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain-postgres:
    name: Brain + companion (SQLite and Postgres), Supabase migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: notecad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: notecad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/*/pyproject.toml
      - name: Install
        run: pip install -e "services/companion[dev]" -e "services/brain[postgres,dev]"
      - name: Supabase migrations 0001-0006 on an empty database
        run: |
          createdb supabase_check
          # what a Supabase project provides and the migrations use: auth.uid(), the API roles
          psql -v ON_ERROR_STOP=1 -d supabase_check <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create role anon; create role authenticated; create role service_role;
          create publication supabase_realtime;
          SQL
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -d supabase_check -f "$f"
          done
      - name: Supabase 0005 still matches sync.py
        working-directory: services/brain
        run: python tools/gen_sync_migration.py --check
      - name: Brain tests, SQLite and Postgres
        working-directory: services/brain
        env:
          NC_BRAIN_TEST_PG_URL: postgresql://postgres:notecad@localhost:5432/notecad_test
        run: |
          createdb notecad_test
          python -m pytest -q -rs
      - name: Companion tests
        working-directory: services/companion
        run: python -m pytest -q

  android:
    name: Phone app (Android APK + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - name: Web build, lint, tests
        working-directory: apps/mobile
        run: |
          npm ci --include=dev
          npm run lint
          npm test
          npm run build
          npx cap sync android
      - name: APK and unit tests
        working-directory: apps/mobile/android
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: notecad-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  desktop:
    name: Desktop app and Tauri window (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Web build, lint, tests
        working-directory: apps/desktop
        run: |
          npm ci --include=dev
          npm run lint
          npm test
          npm run build   # dist first: tauri::generate_context! reads it at compile time
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Tauri installers (unsigned)
        working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: notecad-desktop-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
