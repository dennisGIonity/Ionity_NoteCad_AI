#
# What the desktop PC cannot do itself (Smart App Control, nothing on C:): Postgres, the Android APK and the Tauri
# window are built and tested here, on clean GitHub machines. Models are never needed: the tests are hermetic.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # bash -eo pipefail everywhere: a failing command or a failing "npm test | tee" stops the step
    # (on Windows the default PowerShell would only check the last command of each step)
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain-postgres:
    name: Brain + companion (SQLite and Postgres), Supabase migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: notecad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: notecad
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/*/pyproject.toml
      - name: Install
        run: pip install -e "services/companion[dev]" -e "services/brain[postgres,dev]"
      - name: Supabase migrations 0001-0006 on an empty database
        run: |
          createdb supabase_check
          # what a Supabase project provides and the migrations use: auth.uid(), the API roles
          psql -v ON_ERROR_STOP=1 -d supabase_check <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create role anon; create role authenticated; create role service_role;
          create publication supabase_realtime;
          SQL
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -d supabase_check -f "$f"
          done
      - name: Supabase 0005 still matches sync.py
        working-directory: services/brain
        run: python tools/gen_sync_migration.py --check
      - name: Brain tests, SQLite and Postgres
        working-directory: services/brain
        env:
          NC_BRAIN_TEST_PG_URL: postgresql://postgres:notecad@localhost:5432/notecad_test
        # step logs need a GitHub sign-in; the counts go out as notices, which anyone can read on the run page
        run: |
          createdb notecad_test
          python -m pytest -q -rs > pytest.txt 2>&1 || { cat pytest.txt; exit 1; }
          cat pytest.txt
          echo "::notice title=Brain (SQLite + Postgres 17)::$(tail -1 pytest.txt)"
      - name: Companion tests
        working-directory: services/companion
        run: |
          python -m pytest -q > pytest.txt 2>&1 || { cat pytest.txt; exit 1; }
          cat pytest.txt
          echo "::notice title=Companion::$(tail -1 pytest.txt)"

  android:
    name: Phone app (Android APK + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: 21
      - name: Web build, lint, tests
        working-directory: apps/mobile
        run: |
          npm ci --include=dev
          npm run lint
          npm test | tee vitest.txt
          echo "::notice title=Phone Vitest::$(sed -E 's/\x1b\[[0-9;]*m//g' vitest.txt | grep -E '^ *Tests +[0-9]' | tr -s ' ')"
          npm run build
          npx cap sync android
      - name: APK and unit tests
        working-directory: apps/mobile/android
        run: |
          code=0
          bash ./gradlew --no-daemon assembleDebug testDebugUnitTest > gradle.txt 2>&1 || code=$?
          tail -80 gradle.txt
          if [ "$code" != 0 ]; then
            # the log needs a sign-in, annotations do not: say what broke
            python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as E
          lines = open("gradle.txt", encoding="utf-8", errors="replace").read().splitlines()
          for i, l in enumerate(lines):
              if re.search(r"error:|What went wrong|Could not ", l):
                  print("::error title=Gradle::" + " | ".join(x.strip() for x in lines[i:i + 3])[:900])
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in E.parse(f).getroot().iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      text = " | ".join((bad.get("message") or bad.text or "").strip().splitlines()[:4])
                      print(f"::error title={case.get('classname', '').split('.')[-1]}.{case.get('name')}::{text[:900]}")
          PY
            exit "$code"
          fi
          n=$(python3 -c "import glob, xml.etree.ElementTree as E
          s = [E.parse(f).getroot() for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]
          print(sum(int(x.get('tests')) for x in s), 'run,', sum(int(x.get('failures')) + int(x.get('errors')) for x in s), 'failed')")
          echo "::notice title=Android unit tests::$n; APK $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: notecad-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  desktop:
    name: Desktop app and Tauri window (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Web build, lint, tests
        working-directory: apps/desktop
        run: |
          npm ci --include=dev
          npm run lint
          npm test | tee vitest.txt
          echo "::notice title=Desktop Vitest::$(sed -E 's/\x1b\[[0-9;]*m//g' vitest.txt | grep -E '^ *Tests +[0-9]' | tr -s ' ')"
          npm run build   # dist first: tauri::generate_context! reads it at compile time
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Tauri installers (unsigned)
        working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: notecad-desktop-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
