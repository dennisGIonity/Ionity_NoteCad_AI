# Author: Dennis Grobler (Wabakipi) <dennis.g@ionity.digital>
# Policy 986 AED | License AED 900 | (c) 2026 Ionity Global (Pty) Ltd - All rights reserved
#
# What the desktop PC cannot do itself (Smart App Control, nothing on C:): Postgres, the Android APK and the Tauri
# window are built and tested here, on clean GitHub machines, and every e2e spec runs against a keyless stack.
# Models are never needed: the tests are hermetic.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # bash -eo pipefail everywhere: a failing command or a failing "npm test | tee" stops the step
    # (on Windows the default PowerShell would only check the last command of each step)
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain-postgres:
    name: Brain + companion (SQLite and Postgres), Supabase migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: notecad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: notecad
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/*/pyproject.toml
      - name: Install
        run: pip install -e "services/companion[dev]" -e "services/brain[postgres,dev]"  # dev pins ruff and pyright
      - name: ruff and pyright (brain, companion)
        # pyright sees psycopg here (the [postgres] extra), which WABAKIPI does not install
        run: |
          for d in services/brain services/companion; do
            (cd "$d" && ruff check . --output-format=concise > ruff.txt 2>&1 \
               && pyright --pythonpath "$(which python)" > pyright.txt 2>&1) || {
              cat "$d/ruff.txt" "$d/pyright.txt" 2>/dev/null || true
              { grep -hE ':[0-9]+:[0-9]+: ' "$d/ruff.txt" 2>/dev/null; grep -E ' error: ' "$d/pyright.txt" 2>/dev/null; } \
                | head -20 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' \
                | sed "s|^|::error title=$d static checks::|" || true; echo
              exit 1; }
            echo "::notice title=pyright $d::$(tail -1 "$d/pyright.txt")"
          done
      - name: Supabase migrations 0001-0009 on an empty database
        # a failure goes out as an annotation, which anyone can read on the run page (step logs need a sign-in)
        run: |
          annotate() { sed 's/%/%25/g' "$2" | tail -c 1500 | awk 'BEGIN { ORS = "%0A" } { print }' \
                       | sed "s/^/::error title=$1::/"; echo; }
          createdb supabase_check
          # what a Supabase project provides and the migrations use: auth.uid(), the API roles
          psql -v ON_ERROR_STOP=1 -d supabase_check <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create role anon; create role authenticated; create role service_role;
          create publication supabase_realtime;
          SQL
          # every file in order, then 0007-0009 once more: a hub that already has them runs them again harmlessly
          for f in supabase/migrations/*.sql supabase/migrations/0007_*.sql supabase/migrations/0008_*.sql supabase/migrations/0009_*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -d supabase_check -f "$f" 2> psql.txt \
              || { cat psql.txt; annotate "Supabase $(basename "$f")" psql.txt; exit 1; }
          done
      - name: Supabase 0005 still matches sync.py
        working-directory: services/brain
        run: python tools/gen_sync_migration.py --check
      - name: Supabase 0007-0008 as shipped, 0009 still matches db.py and permissions.py (generated RLS)
        working-directory: services/brain
        run: python tools/gen_rls_migration.py --check
      - name: The POPIA action register matches the code
        working-directory: services/brain
        run: python tools/popia_inventory.py --check
      - name: Brain tests, SQLite and Postgres
        working-directory: services/brain
        env:
          NC_BRAIN_TEST_PG_URL: postgresql://postgres:notecad@localhost:5432/notecad_test
        # step logs need a GitHub sign-in; the counts and failing tests go out as annotations, which anyone can read
        run: |
          createdb notecad_test
          python -m pytest -q -rfEs > pytest.txt 2>&1 || {
            cat pytest.txt
            grep -E '^(FAILED|ERROR) ' pytest.txt | head -20 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' \
              | sed 's/^/::error title=Brain tests failed::/'; echo
            exit 1; }
          cat pytest.txt
          echo "::notice title=Brain (SQLite + Postgres 17)::$(tail -1 pytest.txt)"
      - name: Companion tests
        working-directory: services/companion
        run: |
          python -m pytest -q -rfE > pytest.txt 2>&1 || {
            cat pytest.txt
            grep -E '^(FAILED|ERROR) ' pytest.txt | head -20 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' \
              | sed 's/^/::error title=Companion tests failed::/'; echo
            exit 1; }
          cat pytest.txt
          echo "::notice title=Companion::$(tail -1 pytest.txt)"

  e2e:
    name: Keyless stack + Playwright (Chromium)
    # brain, companion and Edge AI Node as services/brain/tools/keyless_stack.sh starts them: rules router, hash
    # vectors, FixtureSTT for voice notes; the desktop app the brain serves at /app/; every e2e spec
    runs-on: ubuntu-latest
    env:
      NC_KEYLESS_DATA: ${{ github.workspace }}/data/keyless
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/*/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: |
          pip install -e "services/companion[dev]" -e "services/brain[dev]"
          cd apps/desktop && npm ci --include=dev && npm run build && npx playwright install --with-deps chromium
      - name: Start and seed the keyless stack
        env:
          PY: python
        run: |
          services/brain/tools/keyless_stack.sh start
          services/brain/tools/keyless_stack.sh seed
      - name: Playwright
        working-directory: apps/desktop
        env:
          NC_E2E_CHANNEL: chromium
          NC_BRAIN_LOG: ${{ github.workspace }}/data/keyless/brain/logs/api.log
        run: |
          code=0
          npx playwright test --trace retain-on-failure > pw.txt 2>&1 || code=$?
          cat pw.txt
          sed -E 's/\x1b\[[0-9;]*m//g' pw.txt | { grep -E '^ +✘' || true; } | head -20 | sed 's/%/%25/g' \
            | awk 'BEGIN { ORS = "%0A" } { print }' | sed 's/^/::error title=Playwright failed::/'; echo
          echo "::notice title=Playwright (Chromium, keyless)::$(sed -E 's/\x1b\[[0-9;]*m//g' pw.txt | grep -E '^ +[0-9]+ (passed|failed|skipped|flaky)' | tr -s ' ' | paste -sd ',' || true)"
          exit "$code"
      - name: Stop the stack
        if: always()
        run: services/brain/tools/keyless_stack.sh stop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures
          path: |
            data/desktop/playwright
            data/keyless/*/serve.out
            data/keyless/*/logs
          retention-days: 7

  android:
    name: Phone app (Android APK + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: 21
      - name: Web build, lint, tests
        working-directory: apps/mobile
        run: |
          npm ci --include=dev
          npm run lint
          npm test | tee vitest.txt
          echo "::notice title=Phone Vitest::$(sed -E 's/\x1b\[[0-9;]*m//g' vitest.txt | grep -E '^ *Tests +[0-9]' | tr -s ' ')"
          npm run build
          npx cap sync android
      - name: APK and unit tests
        working-directory: apps/mobile/android
        run: |
          code=0
          bash ./gradlew --no-daemon assembleDebug testDebugUnitTest > gradle.txt 2>&1 || code=$?
          tail -80 gradle.txt
          if [ "$code" != 0 ]; then
            # the log needs a sign-in, annotations do not: say what broke
            python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as E
          lines = open("gradle.txt", encoding="utf-8", errors="replace").read().splitlines()
          for i, l in enumerate(lines):
              if re.search(r"error:|What went wrong|Could not ", l):
                  print("::error title=Gradle::" + " | ".join(x.strip() for x in lines[i:i + 3])[:900])
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in E.parse(f).getroot().iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      trace = (bad.text or "").splitlines()
                      causes = [ln.strip() for i, ln in enumerate(trace)
                                if ln.startswith("Caused by") or (i > 0 and trace[i - 1].startswith("Caused by"))]
                      text = " | ".join([(bad.get("message") or "").strip()] + trace[1:3] + causes[-6:])
                      print(f"::error title={case.get('classname', '').split('.')[-1]}.{case.get('name')}::{text[:900]}")
          PY
            exit "$code"
          fi
          n=$(python3 -c "import glob, xml.etree.ElementTree as E
          s = [E.parse(f).getroot() for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]
          print(sum(int(x.get('tests')) for x in s), 'run,', sum(int(x.get('failures')) + int(x.get('errors')) for x in s), 'failed')")
          echo "::notice title=Android unit tests::$n; APK $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: notecad-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  desktop:
    name: Desktop app and Tauri window (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Web build, lint, tests
        working-directory: apps/desktop
        run: |
          npm ci --include=dev
          npm run lint
          npm test | tee vitest.txt
          echo "::notice title=Desktop Vitest::$(sed -E 's/\x1b\[[0-9;]*m//g' vitest.txt | grep -E '^ *Tests +[0-9]' | tr -s ' ')"
          npm run build   # dist first: tauri::generate_context! reads it at compile time
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Tauri installers (unsigned)
        working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: notecad-desktop-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

  beta-install:
    # What a beta tester does (docs/beta/01_DEPLOYMENT_AND_INSTALLATION.md), on a clean Windows machine and in Windows
    # PowerShell 5.1: tools\setup_ibmm.ps1 (CPU, no models: the runner has no GPU and the stack runs keyless), then the
    # brain from the venv the script made, the showcase through it, the app page, and tools\collect_logs.ps1
    name: Beta install on Windows (setup_ibmm.ps1)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: setup_ibmm.ps1 -CpuOnly -SkipModels
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\setup_ibmm.ps1 -Root $PWD -CpuOnly -SkipModels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in "services\brain\.venv\Scripts\python.exe", "services\companion\.venv\Scripts\python.exe", "apps\desktop\dist\index.html") {
            if (-not (Test-Path $f)) { Write-Host "::error title=Beta install::$f is missing after set-up"; exit 1 }
          }
      - name: Brain from the installed venv, showcase, app page
        run: |
          $data = Join-Path $PWD "data\ci"
          New-Item -ItemType Directory -Force "$data\logs" | Out-Null
          $env:NC_BRAIN_DB_URL = "sqlite:///" + ($data -replace '\\', '/') + "/brain.db"
          $env:NC_BRAIN_AUDIO_DIR = "$data\audio"
          $env:NC_BRAIN_ROUTERS = "rules"; $env:NC_BRAIN_EMBED_BACKEND = "hash"; $env:NC_BRAIN_STT = "none"
          $env:NC_BRAIN_WORKER = "1"; $env:NC_BRAIN_BIND = "127.0.0.1"; $env:NC_BRAIN_WORKER_ID = "ci-windows"; $env:PYTHONUTF8 = "1"
          $py = Join-Path $PWD "services\brain\.venv\Scripts\python.exe"
          $p = Start-Process $py -PassThru -WindowStyle Hidden -WorkingDirectory services\brain `
            -RedirectStandardOutput "$data\logs\serve.out.log" -RedirectStandardError "$data\logs\serve.err.log" `
            -ArgumentList @("-m", "notecad_brain.serve", "--port", "8788", "--logs", "$data\logs")
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $up; $i++) {
            try { $up = (Invoke-WebRequest http://127.0.0.1:8788/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $up) { Get-Content "$data\logs\serve.err.log" -Tail 40; Write-Host "::error title=Beta install::the brain did not start"; exit 1 }
          $ErrorActionPreference = "Continue"
          & $py services\brain\tools\seed_farm_showcase.py --reset-clean --auto
          $seed = $LASTEXITCODE
          & $py services\brain\tools\seed_farm_showcase.py --check
          $check = $LASTEXITCODE
          $app = (Invoke-WebRequest http://127.0.0.1:8788/app/ -UseBasicParsing -TimeoutSec 10).StatusCode
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "name='python.exe'" | Where-Object { $_.CommandLine -like '*notecad_brain.serve*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host "::notice title=Beta install on Windows::setup_ibmm.ps1 ok; showcase seed exit $seed, check exit $check; /app/ $app"
          if ($seed -ne 0 -or $check -ne 0 -or $app -ne 200) { exit 1 }
      - name: collect_logs.ps1
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\collect_logs.ps1 -Root $PWD
          $zip = Get-ChildItem ([Environment]::GetFolderPath("Desktop")) -Filter "IBMM_logs_*.zip" | Select-Object -First 1
          if (-not $zip) { Write-Host "::error title=collect_logs::no zip on the Desktop"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries | ForEach-Object { $_.FullName }
          Write-Host ($names -join "`n")
          if ($names | Where-Object { $_ -match '\.(db|wav|webm|ogg|env)$' }) { Write-Host "::error title=collect_logs::data in the log zip"; exit 1 }
          if (-not ($names -contains "pc.txt")) { Write-Host "::error title=collect_logs::pc.txt missing"; exit 1 }

  beta-package:
    # The handover zip for testers (tools/make_beta_package.sh), with the APK this run built
    name: Beta handover package
    needs: [android, beta-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: notecad-debug-apk
          path: apk
      - name: Build the package
        run: |
          apk=$(ls apk/*.apk | head -1)
          tools/make_beta_package.sh out "$apk"
          echo "::notice title=Beta package::$(ls out/*.zip | xargs -n1 basename), $(du -h out/*.zip | cut -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: ibmm-beta-package
          path: out/*.zip
          retention-days: 30
